      const [scanDomain, setScanDomain] = useState('example.com');
      const [scanResult, setScanResult] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [showScoreModal, setShowScoreModal] = useState(false);

      // Score Calculation Math
      const privacyScore = useMemo(() => {
        let score = 82;
        if (isDemoAttackActive && demoAttackStep >= 5 && demoAttackStep < 7) {
          score = 61;
        } else if (protectionLevel === 'maximum') {
          score = 96;
        } else if (protectionLevel === 'strict') {
          score = 88;
        }
        return score;
      }, [isDemoAttackActive, demoAttackStep, protectionLevel]);

      // Traffic Generator Loop
      useEffect(() => {
        if (!isSimulating || isDemoAttackActive) return;
        const interval = setInterval(() => {
          const doms = ['analytics.example.com', 'ads.example.net', 'cdn.example.com', 'tracker.example.net'];
          const chosen = doms[Math.floor(Math.random() * doms.length)];
          const isTracker = chosen.includes('analytics') || chosen.includes('ads') || chosen.includes('tracker');
          const newReq = {
            id: 'req-' + Date.now(),
            timestamp: new Date().toTimeString().split(' ')[0],
            sourceWebsite: 'example.com',
            destinationDomain: chosen,
            requestType: isTracker ? 'POST' : 'GET',
            classification: isTracker ? 'tracker' : 'allowed',
            actionTaken: isTracker ? 'blocked' : 'allowed',
            payloadSnippet: isTracker ? 'event=click&sid=' + Math.random().toString(36).substr(2, 6) : undefined
          };
          setRequests(prev => [newReq, ...prev.slice(0, 30)]);
        }, 3000);
        return () => clearInterval(interval);
      }, [isSimulating, isDemoAttackActive]);

      // Demo Attack Scenario Controller
      const triggerDemoAttack = () => {
        if (isDemoAttackActive) return;
        setIsDemoAttackActive(true);
        setActiveTab('dashboard');
        setDemoAttackStep(1);
        setDemoAttackMessage('1. Target website loaded: malicious-ad-spawner.com');

          setDemoAttackMessage('2. Incoming request surge: 5 requests intercepted');

        setTimeout(() => {
          setDemoAttackStep(3);
          setDemoAttackMessage('3. 10 rapid third-party connections spawned');
        }, 2400);

        setTimeout(() => {
          setDemoAttackStep(4);
          setDemoAttackMessage('4. 🚨 Canvas & WebGL fingerprinting script active!');
        }, 3600);

        setTimeout(() => {
          setDemoAttackStep(5);
          setDemoAttackMessage('5. ⚠️ SENSITIVE DATA TRANSMISSION EXPOSED!');
          setSensitiveLeaks(prev => [

          ]);
        }, 4800);

        setTimeout(() => {
          setDemoAttackStep(6);
          setDemoAttackMessage('6. Privacy score dropped from 94 → 61 (HIGH PRIVACY THREAT)');
        }, 6000);

        setTimeout(() => {
          setDemoAttackStep(7);
          setDemoAttackMessage('7. 🛡️ PRIVACY GATE ZERO-TRUST MITIGATION ENGAGED');
          setSensitiveLeaks(prev => prev.map(l => ({ ...l, blocked: true })));
          setRequests(prev => prev.map(r => ({ ...r, actionTaken: 'blocked' })));
        }, 7500);

        setTimeout(() => {
          setDemoAttackStep(8);
          setDemoAttackMessage('8. ✅ Threat Neutralized: 24 requests analyzed, 8 trackers blocked, 2 leaks prevented.');
        }, 9000);

        setTimeout(() => {
          setIsDemoAttackActive(false);
          setDemoAttackStep(0);
          setDemoAttackMessage('');
        }, 13000);
      };

      // Scanner Trigger
      const runScan = () => {
        setIsScanning(true);
        setTimeout(() => {
          setScanResult({
            domain: scanDomain,
            score: Math.floor(Math.random() * 30 + 55),
            trackers: 8,
            domains: 12,
            cookies: 6,
            fingerprint: true,
            leaks: 1
          });
          setIsScanning(false);
        }, 2000);
      };

      return (
        <div className="min-h-screen bg-[#0a0d14] text-slate-100 flex flex-col font-sans">
          {/* Header */}

              </div>
              <div>

                  <span className="font-bold text-lg text-white font-mono">PRIVACY GATE</span>

                  {/* Stats Cards */}

                  {/* Gauge & Topology Graph */}

                          <circle cx="80" cy="80" r="60" stroke="#1e293b" strokeWidth="10" fill="none" />

                        {privacyScore >= 80 ? 'GOOD PRIVACY' : 'HIGH PRIVACY THREAT'}

                    {/* Network Topology Graph */}
                    <div className="lg:col-span-2 bg-cyber-card border border-cyber-border rounded-2xl p-5 space-y-3">
                      <div className="flex justify-between items-center text-xs text-slate-400">
                        <span className="font-bold text-white">Third-Party Network Topology Map</span>

                  {/* Real-time Activity Table */}
                  <div className="bg-cyber-card border border-cyber-border rounded-2xl p-5 space-y-4 font-mono text-xs">
                    <div className="flex justify-between items-center">
                      <span className="font-bold text-white">Live Network Traffic Stream</span>
                      <button onClick={() => setIsSimulating(!isSimulating)} className="px-3 py-1 bg-blue-600 text-white rounded font-bold">
                        {isSimulating ? 'Pause Stream' : 'Simulate Traffic'}
                      </button>
                    </div>

                    <div className="overflow-x-auto rounded-xl border border-cyber-border">
                      <table className="w-full text-left">
                        <thead className="bg-slate-900 text-slate-400">

                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {requests.map(r => (
                            <tr key={r.id} className="hover:bg-slate-800">

                              <td className="p-2.5 text-white">{r.sourceWebsite}</td>

                              <td className="p-2.5">
                                <span className={`px-2 py-0.5 rounded text-[10px] ${r.classification === 'tracker' ? 'bg-amber-500/20 text-amber-300' : r.classification === 'fingerprint' ? 'bg-rose-500/20 text-rose-300' : 'bg-slate-800 text-slate-300'}`}>
                                  {r.classification}
                                </span>
                              </td>
                              <td className="p-2.5">
                                <span className={`px-2 py-0.5 rounded font-bold ${r.actionTaken === 'blocked' ? 'text-red-400' : 'text-emerald-400'}`}>
                                  {r.actionTaken}
                                </span>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Before / After Comparison */}
                  <div className="grid grid-cols-2 gap-4 font-mono text-xs">
                    <div className="p-4 bg-red-950/20 border border-red-900/40 rounded-xl space-y-2">
                      <div className="font-bold text-red-400">WITHOUT PRIVACY GATE</div>
                      <div>Trackers Active: 14</div>
                      <div>3rd-Party Requests: 27</div>
                      <div>Sensitive Data Requests: 4</div>
                      <div className="text-red-400 font-bold">Blocked: 0 (0%)</div>
                    </div>

                    <div className="p-4 bg-emerald-950/20 border border-emerald-900/40 rounded-xl space-y-2">
                      <div className="font-bold text-emerald-400">WITH PRIVACY GATE</div>
                      <div>Trackers Identified: 14</div>
                      <div>3rd-Party Requests: 27</div>
                      <div>Sensitive Data Neutralized: 4</div>
                      <div className="text-emerald-400 font-bold">Blocked: 19 (70.3%)</div>
                    </div>
                  </div>
                </div>
              )}

              {/* TRACKERS PAGE */}
              {activeTab === 'trackers' && (
                <div className="space-y-6 font-mono text-xs">
                  <div className="bg-cyber-card border border-cyber-border rounded-2xl p-5 space-y-2">
                    <h2 className="font-bold text-white text-base">Categorized Tracker Intelligence Database</h2>
                    <p className="text-slate-400">Classified using non-sensational security categories.</p>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="p-4 bg-cyber-card border border-cyber-border rounded-xl space-y-2">
                      <h4 className="font-bold text-blue-400">Analytics</h4>
                      <p className="text-slate-400">Google Analytics, Matomo, Mixpanel</p>
                    </div>
                    <div className="p-4 bg-cyber-card border border-cyber-border rounded-xl space-y-2">
                      <h4 className="font-bold text-amber-400">Advertising</h4>
                      <p className="text-slate-400">DoubleClick, Meta Pixel, Ad Networks</p>
                    </div>
                    <div className="p-4 bg-cyber-card border border-cyber-border rounded-xl space-y-2">
                      <h4 className="font-bold text-purple-400">Social Tracking</h4>
                      <p className="text-slate-400">Facebook/Meta, X/Twitter, LinkedIn</p>
                    </div>
                    <div className="p-4 bg-cyber-card border border-cyber-border rounded-xl space-y-2">
                      <h4 className="font-bold text-rose-400">Potential Fingerprinting</h4>
                      <p className="text-slate-400">Canvas readout traps, WebGL GPU fingerprinting</p>
                    </div>
                  </div>
                </div>
              )}

              {/* STORAGE PAGE */}
              {activeTab === 'storage' && (
                <div className="bg-cyber-card border border-cyber-border rounded-2xl p-5 space-y-4 font-mono text-xs">
                  <h2 className="font-bold text-white text-base">Client Storage & Cookie Inspector</h2>
                  <div className="overflow-x-auto rounded-xl border border-cyber-border">
                    <table className="w-full text-left">
                      <thead className="bg-slate-900 text-slate-400">
                        <tr>
                          <th className="p-2.5">Name</th>
                          <th className="p-2.5">Domain</th>
                          <th className="p-2.5">Type</th>
                          <th className="p-2.5">Duration</th>
                          <th className="p-2.5">3rd-Party?</th>
                          <th className="p-2.5">Risk</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {storageItems.map(s => (
                          <tr key={s.id}>
                            <td className="p-2.5 font-bold text-white">{s.name}</td>
                            <td className="p-2.5 text-slate-300">{s.domain}</td>
                            <td className="p-2.5">{s.type}</td>
                            <td className="p-2.5">{s.duration}</td>
                            <td className="p-2.5">{s.isThirdParty ? 'YES' : 'No'}</td>
                            <td className="p-2.5 font-bold text-amber-400">{s.riskLevel}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* DATA LEAK MONITOR */}
              {activeTab === 'dataleak' && (
                <div className="space-y-4 font-mono text-xs">
                  <h2 className="font-bold text-white text-base">Sensitive Data Leak Monitor</h2>
                  {sensitiveLeaks.map(leak => (
                    <div key={leak.id} className="p-4 bg-red-950/30 border border-red-800 rounded-2xl space-y-3">
                      <div className="flex justify-between text-red-400 font-bold">
                        <span>⚠ SENSITIVE DATA EXPOSED</span>
                        <span>Destination: {leak.destinationDomain}</span>
                      </div>
                      <div className="space-y-1 text-slate-300">
                        <div>Detected Attributes: {leak.detectedItems.join(', ')}</div>
                        <pre className="p-2.5 bg-black rounded text-amber-300 overflow-x-auto">{leak.payloadSnippet}</pre>
                      </div>
                      <button onClick={() => setSensitiveLeaks(prev => prev.map(l => l.id === leak.id ? {...l, blocked: true} : l))} className="px-4 py-1.5 bg-red-600 text-white font-bold rounded">
                        {leak.blocked ? '✓ REQUEST BLOCKED' : '[BLOCK REQUEST]'}
                      </button>
                    </div>
                  ))}
                </div>
              )}

              {/* PRIVACY REPORT */}
              {activeTab === 'report' && (
                <div className="bg-cyber-card border border-cyber-border rounded-2xl p-6 space-y-4 font-mono text-xs">
                  <h2 className="font-bold text-white text-base">Website Privacy Audit Scanner</h2>
                  <div className="flex gap-2">
                    <input type="text" value={scanDomain} onChange={e => setScanDomain(e.target.value)} className="flex-1 p-2 bg-slate-900 border border-cyber-border rounded text-white" />
                    <button onClick={runScan} className="px-4 py-2 bg-blue-600 text-white font-bold rounded">{isScanning ? 'Scanning...' : 'Scan Website'}</button>
                  </div>

                  {scanResult && (
                    <div className="p-4 bg-slate-900 border border-cyber-border rounded-xl space-y-3">
                      <div className="flex justify-between items-center">
                        <span className="font-bold text-white text-base">Domain: {scanResult.domain}</span>
                        <span className="text-xl font-bold text-emerald-400">Score: {scanResult.score} / 100</span>
                      </div>
                      <div>Trackers Detected: {scanResult.trackers}</div>
                      <div>Third-Party Domains: {scanResult.domains}</div>
                      <div>Recommendations: Block third-party cookies & enable fingerprint trap</div>
                    </div>
                  )}
                </div>
              )}

              {/* PROTECTION CONTROLS */}
              {activeTab === 'protection' && (
                <div className="space-y-4 font-mono text-xs">
                  <h2 className="font-bold text-white text-base">Protection Firewall Controls</h2>
                  <div className="grid grid-cols-3 gap-4">
                    <button onClick={() => setProtectionLevel('balanced')} className={`p-4 rounded-xl border text-left ${protectionLevel === 'balanced' ? 'bg-emerald-950 border-emerald-500' : 'bg-cyber-card border-cyber-border'}`}>🟢 Balanced Mode</button>
                    <button onClick={() => setProtectionLevel('strict')} className={`p-4 rounded-xl border text-left ${protectionLevel === 'strict' ? 'bg-amber-950 border-amber-500' : 'bg-cyber-card border-cyber-border'}`}>🟡 Strict Mode</button>
                    <button onClick={() => setProtectionLevel('maximum')} className={`p-4 rounded-xl border text-left ${protectionLevel === 'maximum' ? 'bg-red-950 border-red-500' : 'bg-cyber-card border-cyber-border'}`}>🔴 Maximum Shield</button>
                  </div>
                </div>
              )}

              {/* ABOUT PAGE */}
              {activeTab === 'about' && (
                <div className="bg-cyber-card border border-cyber-border rounded-2xl p-6 space-y-4 font-mono text-xs">
                  <h2 className="font-bold text-white text-base">Security Principles & Chrome Extension Integration</h2>
                  <p className="text-slate-300">1. Local First Architecture (zero data collection)</p>
                  <p className="text-slate-300">2. Zero Trust Monitoring</p>
                  <p className="text-slate-300">3. Complete Transparency</p>
                  <div className="p-4 bg-slate-900 border border-cyber-border rounded-xl">
                    <div className="font-bold text-blue-400">Manifest V3 Extension Setup for Judges:</div>
                    <div>1. Open chrome://extensions/</div>
                    <div>2. Enable Developer Mode</div>
                    <div>3. Click Load Unpacked → select privacy-gate/extension</div>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
