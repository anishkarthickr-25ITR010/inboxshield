<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background-color: #0a0d14;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f293d;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: bold;
      font-size: 14px;
      color: #3b82f6;
    }
    .score-box {
      background: #121824;
      border: 1px solid #1f293d;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
    }
    .score-num {
      font-size: 36px;
      font-weight: bold;
      color: #10b981;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      font-size: 11px;
      font-weight: bold;
      margin-top: 6px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🛡️ PRIVACY GATE</div>
    <span style="font-size: 10px; color: #10b981;">ACTIVE</span>
  </div>

  <div class="score-box">
    <div style="font-size: 11px; color: #94a3b8;">ACTIVE SITE PRIVACY SCORE</div>
    <div className="score-num" id="score">82 / 100</div>
    <div className="status-badge">GOOD PRIVACY</div>
  </div>

  <button className="btn" id="openDash">Open Full Dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
